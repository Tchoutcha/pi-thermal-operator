# This rule is not used by the project pi-thermal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to thermal.stellat.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pi-thermal-operator
    app.kubernetes.io/managed-by: kustomize
  name: thermal-thermalpolicy-viewer-role
rules:
- apiGroups:
  - thermal.stellat.dev
  resources:
  - thermalpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - thermal.stellat.dev
  resources:
  - thermalpolicies/status
  verbs:
  - get
