# This rule is not used by the project pi-thermal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the thermal.stellat.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pi-thermal-operator
    app.kubernetes.io/managed-by: kustomize
  name: thermal-thermalpolicy-editor-role
rules:
- apiGroups:
  - thermal.stellat.dev
  resources:
  - thermalpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - thermal.stellat.dev
  resources:
  - thermalpolicies/status
  verbs:
  - get
